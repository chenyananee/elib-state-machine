name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (MAX_DEPTH=${{ matrix.max_depth }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 16 = library default; 32 = verify the external override path works.
        max_depth: [16, 32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DELIB_FSM_HSM_MAX_DEPTH=${{ matrix.max_depth }}

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
